# Builds, signs, and uploads the iOS app to TestFlight — no Mac required.
#
# Signing is cloud-managed: xcodebuild authenticates with an App Store
# Connect API key and creates/uses Apple-managed certificates and
# profiles on the fly (-allowProvisioningUpdates). Nothing to install
# or export from a local machine.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     — App Store Connect API key ID
#   ASC_ISSUER_ID  — Issuer ID from the same API keys page
#   ASC_KEY_P8     — full contents of the AuthKey_<KEY_ID>.p8 file
#
# Trigger manually from the Actions tab (Run workflow).
#
# BUILD NUMBER: run_number + BUILD_NUMBER_OFFSET.
#
# The offset exists because this workflow did not upload the first 19
# builds — those went up from Xcode between 2026-08-07 and 2026-08-21,
# before this file was added on 2026-09-14. So github.run_number starts
# at 1 here, and an unoffset first run would have tried to upload build
# 1 of version 1.0, which already exists. App Store Connect rejects a
# build number it has already seen, so that run would have died at the
# upload step looking like a signing or export failure.
#
# Raise the offset if builds are ever uploaded by another route again;
# the number only has to increase, it does not have to be contiguous.

name: iOS TestFlight

on:
  workflow_dispatch:

env:
  # Highest build already in App Store Connect for version 1.0 is 19
  # (uploaded from Xcode, 2026-08-21). +20 clears it with headroom, so the
  # first run of this workflow uploads build 21.
  BUILD_NUMBER_OFFSET: 20

jobs:
  build-upload:
    name: Build, sign, upload to TestFlight
    # App Store Connect rejects uploads built with anything older than the
    # iOS 26 SDK, so the runner must have Xcode 26 (macos-15 tops out at 16.x).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 found on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        # Pastes from Windows editors often arrive with CRLF line endings or
        # with the newlines flattened entirely — either breaks PEM parsing
        # (CryptoKitASN1Error.invalidPEMDocument). Normalize and, if needed,
        # rebuild the standard PEM layout from the base64 body.
        run: |
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          CLEANED="$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')"
          if ! printf '%s' "$CLEANED" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "::error::ASC_KEY_P8 secret is missing '-----BEGIN PRIVATE KEY-----'. Paste the ENTIRE contents of the .p8 file, including the BEGIN/END lines."
            exit 1
          fi
          if [ "$(printf '%s\n' "$CLEANED" | wc -l | tr -d ' ')" -lt 3 ]; then
            BODY="$(printf '%s' "$CLEANED" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')"
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s\n' "$BODY" | fold -w 64
              echo "-----END PRIVATE KEY-----"
            } > "$KEYFILE"
          else
            printf '%s\n' "$CLEANED" > "$KEYFILE"
          fi
          head -c 30 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY" && echo "Key file written and looks like PEM."

      # Archive UNSIGNED: a signed archive would want a development
      # provisioning profile, which requires a registered device — this
      # team has none (no Mac, no test device). Signing happens at export,
      # where cloud signing mints an App Store distribution profile via
      # the API key; App Store profiles need no devices.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=GWVFKQA45L \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + ${BUILD_NUMBER_OFFSET} ))

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
